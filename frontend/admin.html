<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin panel for managing placement opportunities and applications">
  <title>Admin Panel - College Placement Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <div class="nav-brand">
        <h1>College Placement Portal - Admin</h1>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="jobs.html">Opportunities</a></li>
        <li><a href="applications.html">My Applications</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="admin.html" class="active" aria-current="page">Admin</a></li>
      </ul>
    </div>
  </nav>

  <main class="admin-page" role="main">
    <div class="container">
      <div class="page-header">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span>/</span>
          <span aria-current="page">Admin Panel</span>
        </nav>
        <h1>Admin Panel</h1>
        <p>Manage placement opportunities and review applications</p>
      </div>

      <div class="admin-auth">
        <div class="form-group">
          <label for="admin-key">Admin Key (Default: <code>admin123</code>)</label>
          <input type="password" id="admin-key" value="admin123" placeholder="Enter admin key"
                 autocomplete="current-password" aria-label="Admin authentication key">
        </div>
        <button class="btn btn-primary" id="authenticate-admin">Authenticate Admin</button>
      </div>

      <div class="admin-content" id="admin-content">
        <div class="empty-state">
          <p>Enter admin key to access the admin panel.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 College Placement Portal. All rights reserved.</p>
    </div>
  </footer>

  <div class="toast-container" id="toast-container" role="alert" aria-live="polite"></div>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
